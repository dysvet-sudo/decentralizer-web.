:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#07141e;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 70% 0%,#674338 0,transparent 38%),radial-gradient(circle at 0 85%,#133c4b 0,transparent 45%),#07141e}#app{max-width:780px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 15px calc(100px + env(safe-area-inset-bottom))}header{height:88px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand b{font-size:15px;letter-spacing:1px}.brand small{display:block;color:#ccdbdc;font-size:12px;margin-top:4px}.orb{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:linear-gradient(140deg,#f8aa65,#803e54,#203c5e);box-shadow:0 5px 30px #e77b5444;font-size:25px}.ghost,.secondary{border:1px solid #ffffff36;background:#ffffff12;color:white;border-radius:15px;padding:11px 16px}.ghost{font-size:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 18px}h1{font-size:27px;margin:8px 0}h2{font-size:19px;margin:8px 0}.muted{color:#b5c5cd;font-size:13px}.card{background:linear-gradient(140deg,#ffffff1b,#ffffff0a);border:1px solid #ffffff2c;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 12px 30px #0003;backdrop-filter:blur(12px)}.card h2,.card h3{overflow-wrap:anywhere;margin:0 0 8px}.card h3{font-size:17px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.between{justify-content:space-between}.pill{padding:6px 10px;border-radius:20px;background:#ffffff15;color:#c5d2da;font-size:12px}.primary{background:linear-gradient(130deg,#ffb06f,#e57c5b);border:0;color:#201c20;font-weight:800;border-radius:15px;padding:12px 17px;box-shadow:0 5px 15px #9c473544}.primary:disabled{opacity:.42;box-shadow:none}.danger{border:1px solid #f77b7280;background:#9b343440;color:#ffe2db;padding:10px;border-radius:12px}.secondary{font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.empty{text-align:center;padding:42px 15px;border:1px dashed #ffffff36;border-radius:22px;color:#c6d7df}.progress{height:7px;border-radius:6px;background:#ffffff1e;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:linear-gradient(90deg,#fb7656,#a5d58e);transition:width .25s}.line{margin-left:14px;padding-left:13px;border-left:1px solid #ffffff32}.task{padding:12px;margin:9px 0;border:1px solid #ffffff26;border-radius:15px;background:#0e202a99}.task.done{opacity:.65}.task .actions{margin-top:8px}.urgent{color:#ffb07f}.overdue{color:#ff827e}input,textarea{font:inherit;min-width:0;width:100%;background:#091922;border:1px solid #ffffff4d;color:#fff;border-radius:12px;padding:12px}textarea{min-height:72px;resize:vertical}label{font-size:13px;color:#c8d2d8;display:block;margin-top:12px}dialog{color:white;background:#14252f;border:1px solid #ffffff44;border-radius:20px;width:min(94vw,430px);padding:22px}dialog::backdrop{background:#000b}nav{position:fixed;z-index:2;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#0a1925e8;backdrop-filter:blur(20px);border-top:1px solid #ffffff24;padding:11px 10px calc(11px + env(safe-area-inset-bottom))}nav button{width:min(31vw,230px);color:#aebac3;background:transparent;border:0;border-radius:15px;padding:9px;font-size:22px}nav button span{display:block;font-size:12px}nav button.active{background:#ffffff1b;color:#ffb582}#notice:not(:empty){margin:3px 0;padding:11px;border:1px solid #f7c48b77;border-radius:12px;color:#ffcb93}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ffbc81;outline-offset:3px}@media(min-width:800px){nav{max-width:780px;margin:auto;border-radius:18px 18px 0 0}}

</style><link rel="manifest" href="./manifest.webmanifest"></head><body><div id="app"><header><div class="brand"><div class="orb">✦</div><div><b>ДЕЦЕНТРАЛИЗАТОР</b><small>Путь к мечте</small></div></div><button class="ghost" id="backup" aria-label="Экспорт данных">⇩</button></header><div id="notice" role="status" aria-live="polite"></div><main id="content"></main><nav aria-label="Разделы"><button data-tab="goals">◎<span>Цели</span></button><button data-tab="today">◷<span>Сегодня</span></button><button data-tab="done">✓<span>Готово</span></button></nav></div><input id="import" type="file" accept="application/json" hidden><script>
'use strict';
const KEY='decentralizer-pwa-v1';
const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({schema:1,goals:[],items:[],awards:0});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh();if(db.schema!==1||!Array.isArray(db.goals)||!Array.isArray(db.items))throw Error('schema')}catch(e){db=fresh();document.addEventListener('DOMContentLoaded',()=>notice('Не удалось прочитать сохранённые данные. Импортируй резервную копию, если она есть.'))}
let tab='goals',goalId=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){notice('Не удалось сохранить данные. Проверь свободное место и настройки Safari.')}};
const notice=s=>{document.querySelector('#notice').textContent=s;setTimeout(()=>{const n=document.querySelector('#notice');if(n?.textContent===s)n.textContent=''},7000)};
const goal=id=>db.goals.find(x=>x.id===id);
const item=id=>db.items.find(x=>x.id===id);
const children=(pid,gid)=>db.items.filter(x=>x.goalId===gid&&x.parentId===pid);
const descendants=id=>{let all=[];for(const c of db.items.filter(x=>x.parentId===id)){all.push(c,...descendants(c.id))}return all};
const finished=x=>x.done;
const canFinish=x=>children(x.id,x.goalId).every(c=>c.done);
const leaves=gid=>db.items.filter(x=>x.goalId===gid&&children(x.id,gid).length===0);
const progress=gid=>{let ls=leaves(gid);return ls.length?Math.round(ls.filter(x=>x.done).length*100/ls.length):0};
const goalReady=g=>{const roots=children(null,g.id);return roots.length>0&&roots.every(x=>x.done)};
const dateHint=x=>x.date?`<span class="pill ${x.date<todayISO()&&!x.done?'overdue':''}">${x.date<todayISO()&&!x.done?'Просрочено · ':''}${esc(x.date)}</span>`:'<span class="pill">Без даты</span>';
function render(){let main=document.querySelector('#content');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));main.innerHTML=tab==='goals'?renderGoals():tab==='today'?renderToday():renderDone()}
function renderGoals(){if(goalId){const g=goal(goalId);if(!g){goalId=null;return renderGoals()}return `<div class="section-head"><button class="secondary" data-action="back">← Все цели</button><button class="secondary" data-action="add" data-goal="${g.id}">+ Задача</button></div><h1>${esc(g.title)}</h1><div class="muted">Прогресс по конечным подзадачам — ${progress(g.id)}%</div><div class="progress"><div style="width:${progress(g.id)}%"></div></div>${children(null,g.id).map(x=>renderTask(x)).join('')||'<div class="empty">Пока нет задач. Добавь первую.</div>'}<div class="actions"><button class="primary" data-action="finish-goal" data-id="${g.id}" ${goalReady(g)?'':'disabled'}>Завершить цель</button><button class="danger" data-action="delete-goal" data-id="${g.id}">Удалить цель</button></div>`}
return `<div class="section-head"><h1>Мои цели</h1><button class="primary" data-action="new-goal">+ Цель</button></div>${db.goals.filter(g=>!g.done).map(g=>`<article class="card"><h2>${esc(g.title)}</h2><div class="muted">${progress(g.id)}% задач выполнено</div><div class="progress"><div style="width:${progress(g.id)}%"></div></div><div class="actions"><button class="secondary" data-action="open-goal" data-id="${g.id}">Открыть древо</button></div></article>`).join('')||'<div class="empty">Начни с одной цели. Потом разбей её на конкретные действия.</div>'}`}
function renderTask(x){let kids=children(x.id,x.goalId);return `<div class="task ${x.done?'done':''}"><div class="row between"><strong>${esc(x.title)}</strong>${x.urgent&&!x.done?'<span class="urgent">🔥 Срочно</span>':''}</div><div class="row">${dateHint(x)}${x.done?'<span class="pill">✓ Выполнено</span>':''}</div>${kids.length?`<div class="line">${kids.map(renderTask).join('')}</div>`:''}<div class="actions">${!x.done?`<button class="secondary" data-action="add" data-parent="${x.id}" data-goal="${x.goalId}">+ Подзадача</button><button class="secondary" data-action="edit" data-id="${x.id}">Изменить</button><button class="primary" data-action="finish" data-id="${x.id}" ${canFinish(x)?'':'disabled'}>Выполнено</button>`:''}<button class="danger" data-action="delete" data-id="${x.id}">×</button></div></div>`}
function renderToday(){const xs=db.items.filter(x=>!x.done&&!goal(x.goalId)?.done&&children(x.id,x.goalId).length===0&&(!x.date||x.date<=todayISO()));xs.sort((a,b)=>(Number(b.urgent)-Number(a.urgent))||((a.date||'9999').localeCompare(b.date||'9999')));return `<div class="section-head"><h1>Задачи на сегодня</h1><span class="pill">${xs.length} шт.</span></div>${xs.map(x=>`<article class="card"><h3>${x.urgent?'🔥 ':''}${esc(x.title)}</h3><div class="muted">${esc(goal(x.goalId)?.title||'Цель удалена')}</div><div class="row" style="margin-top:10px">${dateHint(x)}</div><div class="actions"><button class="primary" data-action="finish" data-id="${x.id}">Выполнено</button><button class="secondary" data-action="edit" data-id="${x.id}">Дата / срочность</button><button class="secondary" data-action="add" data-parent="${x.id}" data-goal="${x.goalId}">Разбить +</button></div></article>`).join('')||'<div class="empty">Сегодня свободно. Добавь задачи к целям — конечные без даты тоже появятся здесь.</div>'}`}
function renderDone(){const doneGoals=db.goals.filter(g=>g.done);return `<div class="section-head"><h1>Готово</h1><span class="pill">🏆 ${db.awards} наград</span></div>${doneGoals.map(g=>`<div class="card"><h3>🏆 ${esc(g.title)}</h3><div class="muted">Цель завершена</div></div>`).join('')||'<div class="empty">Завершённые цели появятся здесь.</div>'}<div class="card"><h3>Резервная копия</h3><div class="muted">Данные хранятся только в браузере этого устройства. Экспортируй их перед сменой телефона или очисткой Safari.</div><div class="actions"><button class="secondary" data-action="export">Экспорт JSON</button><button class="secondary" data-action="import">Импорт JSON</button></div></div>`}
function askFields({title='',date='',urgent=false},isGoal=false){return new Promise(resolve=>{const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><h2>${isGoal?'Новая цель':'Задача'}</h2><label>Название<input name="title" maxlength="200" required value="${esc(title)}"></label>${isGoal?'':`<label>Дата (необязательно)<input name="date" type="date" value="${esc(date)}"></label><label class="row"><input style="width:auto" name="urgent" type="checkbox" ${urgent?'checked':''}> Срочная задача</label>`}<div class="actions"><button class="primary" value="save">Сохранить</button><button class="secondary" value="cancel">Отмена</button></div></form>`;document.body.append(d);d.showModal();d.addEventListener('close',()=>{let f=d.querySelector('form'),v=d.returnValue;if(v==='save'){const fd=new FormData(f),title=String(fd.get('title')||'').trim();if(title)resolve({title,date:String(fd.get('date')||''),urgent:fd.get('urgent')==='on'});else resolve(null)}else resolve(null);d.remove()},{once:true})})}
async function action(a,id,parent,gid){if(a==='back'){goalId=null;tab='goals'}else if(a==='open-goal'){goalId=id;tab='goals'}else if(a==='new-goal'){let v=await askFields({},true);if(v){db.goals.push({id:uid(),title:v.title,done:false});save()}}else if(a==='add'){let v=await askFields({});if(v){db.items.push({id:uid(),goalId:gid,parentId:parent||null,title:v.title,date:v.date,urgent:v.urgent,done:false});save()}}else if(a==='edit'){let x=item(id);if(x){let v=await askFields(x);if(v){Object.assign(x,v);save()}}}else if(a==='finish'){let x=item(id);if(x&&!x.done&&canFinish(x)){x.done=true;if(children(x.id,x.goalId).length>=2)db.awards++;save()}else notice('Сначала выполни все подзадачи.')}else if(a==='finish-goal'){let g=goal(id);if(g&&!g.done&&goalReady(g)){g.done=true;db.awards++;goalId=null;notice('🏆 Цель достигнута!');save()}}else if(a==='delete'){let x=item(id);if(x&&confirm('Удалить задачу и все её подзадачи?')){let ids=new Set([x.id,...descendants(x.id).map(i=>i.id)]);db.items=db.items.filter(i=>!ids.has(i.id));save()}}else if(a==='delete-goal'){if(confirm('Удалить цель и все её задачи?')){db.goals=db.goals.filter(g=>g.id!==id);db.items=db.items.filter(x=>x.goalId!==id);goalId=null;save()}}else if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`decentralizer-backup-${todayISO()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='import'){document.querySelector('#import').click()}render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.id,b.dataset.parent,b.dataset.goal)});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;goalId=null;render()}));document.querySelector('#backup').addEventListener('click',()=>action('export'));
document.querySelector('#import').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(v.schema!==1||!Array.isArray(v.goals)||!Array.isArray(v.items)||typeof v.awards!=='number'||v.goals.some(g=>!g.id||typeof g.title!=='string')||v.items.some(i=>!i.id||!i.goalId||typeof i.title!=='string'))throw Error('Некорректный формат');if(confirm('Импорт заменит все текущие данные. Продолжить?')){db=v;save();goalId=null;render();notice('Данные импортированы')}}catch(err){notice('Не удалось импортировать: '+err.message)}e.target.value=''});
render();

</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script></body></html>
